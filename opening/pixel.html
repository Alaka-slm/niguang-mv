<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>逆光 · 开场 · 像素游戏风</title>
<style>
  html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw;max-height:100vh;image-rendering:pixelated;image-rendering:crisp-edges}
</style>
</head>
<body>
<canvas id="out" width="1920" height="1080"></canvas>
<script>
// ───── 规格：320×180 逻辑画布，逐格绘制；24 色限定调色板；渐变 = Bayer 抖动；×6 整数放大且关闭平滑 ─────
const W = 320, H = 180, SCALE = 6;
const PAL = [
  '#07060f', '#0e0f24', '#161a38', '#1f2650', '#2a3466', '#36457c', '#4a5d95', '#6680b0', // 0-7  夜色墙面 → 冷光
  '#d98a4e', '#f2b950', '#ffe39a', '#fff7dc',                                             // 8-11 日出金光
  '#1a1420', '#2a2230', '#3b3142', '#7a5250', '#c4844f',                                  // 12-16 木地板（亮部被晨光染暖）
  '#5a2f3d', '#9a4a52', '#d07a6e',                                                        // 17-19 褪色珊瑚围巾（全片唯一暖色）
  '#3d5f6e', '#6f9aa6', '#a9cdd2',                                                        // 20-22 窗帘青
  '#12101c',                                                                              // 23 剪影
  '#5c3a62', '#b4605a'                                                                    // 24-25 晨曦紫 / 珊瑚橙（天空渐变过渡色）
];
const RGB = PAL.map(h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16)));
const buf = new Uint8Array(W * H);
const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
const bay = (x, y) => (BAYER[y & 3][x & 3] + 0.5) / 16;
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));

function px(x, y, c) { x |= 0; y |= 0; if (x >= 0 && y >= 0 && x < W && y < H) buf[y * W + x] = c; }
function get(x, y) { return buf[y * W + x]; }
// 抖动渐变：t∈[0,1] 在色阶数组上取值，小数部分用 Bayer 阈值决定取上一阶还是下一阶
function ramp(x, y, t, arr) {
  const v = clamp(t) * (arr.length - 1), i = Math.floor(v);
  return arr[(v - i) > bay(x, y) ? Math.min(i + 1, arr.length - 1) : i];
}
function inPoly(x, y, P) {
  let c = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const [xi, yi] = P[i], [xj, yj] = P[j];
    if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function fillPoly(P, fn) {
  const xs = P.map(p => p[0]), ys = P.map(p => p[1]);
  for (let y = Math.floor(Math.min(...ys)); y <= Math.ceil(Math.max(...ys)); y++)
    for (let x = Math.floor(Math.min(...xs)); x <= Math.ceil(Math.max(...xs)); x++)
      if (x >= 0 && y >= 0 && x < W && y < H && inPoly(x + .5, y + .5, P)) {
        const c = typeof fn === 'function' ? fn(x, y) : fn;
        if (c != null) px(x, y, c);
      }
}
function line(x0, y0, x1, y1, fn) { // Bresenham
  x0 |= 0; y0 |= 0; x1 |= 0; y1 |= 0;
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (;;) {
    fn(x0, y0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e;
    if (e2 >= dy) { e += dy; x0 += sx; }
    if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function rng(seed) { return () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296); }

const LIGHTER = { 0: 1, 1: 2, 2: 24, 3: 24, 4: 24, 5: 25, 6: 25, 7: 8, 24: 25, 25: 8, 8: 9, 9: 10, 12: 13, 13: 14, 14: 15, 15: 16, 16: 9, 20: 21, 21: 22 };   // 被阳光照到 → 变暖变亮
const DARKER = { 1: 0, 2: 1, 3: 2, 4: 3, 5: 4, 6: 5, 7: 6, 13: 12, 14: 13, 15: 14, 16: 15, 21: 20, 22: 21, 10: 9, 9: 8, 8: 25, 25: 24, 24: 3 };

// ───── 场景常量 ─────
const WIN = { x0: 204, x1: 250, y0: 26, y1: 118 };   // 窗洞
const FLOOR_Y = 128;
const BEAM = [[204, 30], [250, 30], [266, 180], [140, 180]];   // 一道光柱（单一光源，不做散射光线）
const PATCH = [[204, FLOOR_Y], [250, FLOOR_Y], [262, 180], [150, 180]];

function drawStatic() {
  // 墙面：越靠近窗越亮
  for (let y = 0; y < FLOOR_Y; y++) for (let x = 0; x < W; x++) {
    const d = Math.hypot((x - 227) * 0.8, (y - 70) * 1.2);
    px(x, y, ramp(x, y, 1 - d / 175, [0, 1, 2, 3, 24, 25, 8]));
  }
  // 墙上的空画框（无文字）
  fillPoly([[92, 48], [122, 48], [122, 76], [92, 76]], 2);
  fillPoly([[95, 51], [119, 51], [119, 73], [95, 73]], (x, y) => ramp(x, y, (x - 95) / 60, [1, 2]));
  // 踢脚线
  for (let x = 0; x < W; x++) { px(x, FLOOR_Y - 2, 2); px(x, FLOOR_Y - 1, 1); }
  // 地板：横缝 + 指向窗下的竖缝
  for (let y = FLOOR_Y; y < H; y++) for (let x = 0; x < W; x++) px(x, y, ramp(x, y, (y - FLOOR_Y) / 70 + 0.1, [12, 13, 14]));
  for (let k = 1; k < 9; k++) { const y = FLOOR_Y + Math.round(52 * Math.pow(k / 9, 1.5)); for (let x = 0; x < W; x++) if (get(x, y) !== 12) px(x, y, DARKER[get(x, y)] ?? 12); }
  for (let k = -6; k < 12; k++) line(227, 70, -260 + k * 62, 180, (x, y) => { if (y >= FLOOR_Y && (x + y) % 2 === 0) px(x, y, 12); });
  // 窗外：冷白薄雾 + 一点更亮的光核，底部是远处屋顶剪影
  fillPoly([[WIN.x0, WIN.y0], [WIN.x1, WIN.y0], [WIN.x1, WIN.y1], [WIN.x0, WIN.y1]], (x, y) => {   // 日出天空：上蓝紫 → 珊瑚 → 金黄
    const d = Math.hypot(x - 232, (y - 98) * 1.1);
    if (d < 7) return 11;                                                   // 刚露头的太阳
    if (d < 11) return ramp(x, y, 1 - (d - 7) / 4, [10, 11]);
    return ramp(x, y, (y - WIN.y0) / 80 + Math.max(0, 1 - d / 45) * 0.35, [5, 24, 25, 8, 9, 10]);
  });
  const roof = [104, 104, 100, 100, 100, 106, 106, 97, 97, 97, 103, 103, 108, 108, 101, 101, 101, 105, 105, 99, 99, 104, 104];
  for (let x = WIN.x0; x < WIN.x1; x++) { const h = roof[Math.floor((x - WIN.x0) / 2)] ?? 104; for (let y = h; y < WIN.y1; y++) px(x, y, ramp(x, y, (y - h) / 20, [24, 1])); }
  // 窗框与十字窗棂
  const frame = (x, y) => px(x, y, 2);
  for (let i = 0; i < 3; i++) {
    line(WIN.x0 - i, WIN.y0 - i, WIN.x1 + i, WIN.y0 - i, frame); line(WIN.x0 - i, WIN.y1 + i, WIN.x1 + i, WIN.y1 + i, frame);
    line(WIN.x0 - i, WIN.y0 - i, WIN.x0 - i, WIN.y1 + i, frame); line(WIN.x1 + i, WIN.y0 - i, WIN.x1 + i, WIN.y1 + i, frame);
  }
  for (let y = WIN.y0; y < WIN.y1; y++) { px(226, y, 3); px(227, y, 2); }
  for (let x = WIN.x0; x < WIN.x1; x++) { px(x, 63, 3); px(x, 64, 2); }
  // 窗台
  for (let x = WIN.x0 - 5; x <= WIN.x1 + 5; x++) { px(x, WIN.y1 + 3, 4); px(x, WIN.y1 + 4, 2); }
  // 推开的右扇窗（“睁开眼 打开窗”）
  const sash = [[WIN.x1 + 3, WIN.y0 - 2], [WIN.x1 + 16, WIN.y0 - 8], [WIN.x1 + 16, WIN.y1 + 8], [WIN.x1 + 3, WIN.y1 + 2]];
  fillPoly(sash, 2);
  fillPoly([[WIN.x1 + 5, WIN.y0 + 1], [WIN.x1 + 14, WIN.y0 - 4], [WIN.x1 + 14, WIN.y1 + 4], [WIN.x1 + 5, WIN.y1 - 1]],
    (x, y) => ramp(x, y, 0.2 + (y - WIN.y0) / 120 - (x - WIN.x1) / 40, [4, 24, 25, 8, 9]));
  // 窗帘杆
  for (let x = 186; x < 266; x++) { px(x, 21, 1); px(x, 22, 2); }
  // 地上的窗形光斑 + 窗棂投影
  fillPoly(PATCH, (x, y) => ramp(x, y, 1.05 - (y - FLOOR_Y) / 70, [14, 15, 16, 9, 10]));
  line(227, FLOOR_Y, 206, 180, (x, y) => { px(x, y, 14); px(x + 1, y, 14); });
  for (let x = 140; x < 270; x++) for (const y of [150, 151]) if (inPoly(x + .5, y + .5, PATCH)) px(x, y, 14);
  // 左侧旧椅子剪影（带一点冷色轮廓光）
  const chair = [[56, 104, 59, 142], [76, 104, 79, 158], [56, 136, 82, 140], [58, 140, 60, 168], [78, 140, 80, 164], [62, 140, 63, 160], [56, 104, 79, 107]];
  for (const [a, b, c, d] of chair) for (let y = b; y <= d; y++) for (let x = a; x <= c; x++) px(x, y, 1);
  for (let y = 104; y < 168; y++) for (let x = 56; x < 83; x++) if (get(x, y) === 1 && get(x + 1, y) !== 1) px(x, y, 3);
}

function drawCurtain(f) {
  // 被风吹进屋内的窗帘：左缘按帧摆动（逐帧换画，不补间）
  const ph = [0, 1.6, 3.1, 4.7][f];
  for (let y = 23; y < 122; y++) {
    const k = (y - 23) / 99;
    const left = Math.round(205 - k * 30 - 7 * Math.sin(y / 11 + ph) * k);
    const right = Math.round(214 - k * 6 + 2 * Math.sin(y / 8 + ph));
    for (let x = left; x <= right; x++) {
      const fold = 0.5 + 0.5 * Math.sin((x - left) * 0.9 + y * 0.06 + ph);
      const back = inPoly(x + .5, y + .5, [[WIN.x0, WIN.y0], [WIN.x1, WIN.y0], [WIN.x1, WIN.y1], [WIN.x0, WIN.y1]]) ? 0.45 : 0;
      px(x, y, back ? ramp(x, y, fold * 0.6 + 0.3, [24, 25, 8, 9]) : ramp(x, y, fold * 0.55, [20, 21, 22]));
    }
  }
  for (let y = 23; y < 126; y++) for (let x = 252; x < 262; x++) {   // 右侧垂落的窗帘
    if (x > 252 + (y - 23) / 30 + 1.5 * Math.sin(y / 9 + ph * 0.3)) px(x, y, ramp(x, y, 0.15 + 0.35 * Math.sin(x * 1.2 + 1), [20, 21]));
  }
}

// ───── 女孩：背对镜头站在光柱边缘 ─────
const SCARF_TAIL = [
  [[161, 122], [157, 121], [153, 122], [149, 121], [146, 123]],
  [[161, 122], [157, 123], [153, 122], [149, 123], [145, 122]],
  [[161, 122], [157, 122], [152, 120], [148, 121], [145, 119]],
  [[161, 122], [157, 121], [153, 123], [149, 124], [146, 126]],
];
function girlMask(f) {
  const m = new Set(), add = (x, y) => m.add(x + ',' + y);
  const P = (poly) => { for (let y = 100; y <= 160; y++) for (let x = 150; x <= 186; x++) if (inPoly(x + .5, y + .5, poly)) add(x, y); };
  for (let y = 108; y <= 120; y++) for (let x = 162; x <= 174; x++) if (Math.hypot(x - 168, (y - 114) * 1.08) <= 5.4) add(x, y);   // 头
  P([[163, 114], [173, 114], [174, 124], [175, 128], [161, 128], [162, 124]]);                                       // 披肩发
  const strands = [[[-1, 0], [-2, 1], [-3, 1]], [[-1, 0], [-2, 0], [-3, -1], [-4, -1]], [[-1, 1], [-2, 1], [-3, 2]], [[-1, 0], [-2, -1], [-3, -1], [-4, 0]]][f];
  for (const base of [117, 121, 125]) for (const [dx, dy] of strands) add(162 + dx, base + dy);                    // 被风吹起的发丝
  const hem = [0, -1, -2, -1][f];
  P([[160, 124], [176, 124], [178, 127], [177, 140], [180, 151], [156 + hem, 151], [159, 140], [158, 127]]);        // 肩与外套
  P([[155, 127], [157, 127], [156, 143], [154, 143]]);                                                               // 左臂（与身体留 1px 缝透光）
  P([[179, 127], [181, 127], [182, 143], [180, 143]]);                                                               // 右臂
  for (let y = 151; y <= 158; y++) { for (let x = 163; x <= 165; x++) add(x, y); for (let x = 171; x <= 173; x++) add(x, y); }
  for (let x = 162; x <= 166; x++) add(x, 159); for (let x = 170; x <= 174; x++) add(x, 159);
  return m;
}
function drawGirl(f) {
  // 影子：光在身后，影子拖向镜头（左下）
  fillPoly([[161, 159], [175, 159], [146, 180], [112, 180]], (x, y) => {
    const t = 1 - (y - 159) / 40;
    return bay(x, y) < 0.35 + t * 0.6 ? (DARKER[DARKER[get(x, y)]] ?? 12) : null;
  });
  const m = girlMask(f), has = (x, y) => m.has(x + ',' + y);
  for (const k of m) {
    const [x, y] = k.split(',').map(Number);
    let c = 23;
    if (!has(x + 1, y) && y < 152 && x >= 167) c = 10;                 // 右缘轮廓光
    else if (!has(x, y - 1) && x >= 166) c = 9;            // 头顶 / 肩头轮廓光
    else if (!has(x + 2, y) && y < 150 && x >= 168) c = 8;
    px(x, y, c);
  }
  // 围巾：脖子一圈 + 被风扯向左边的尾巴
  for (let x = 162; x <= 175; x++) { px(x, 122, 18); px(x, 123, x > 172 ? 19 : 17); }
  px(175, 122, 19); px(176, 123, 19);
  const tail = SCARF_TAIL[f];
  for (let i = 0; i < tail.length - 1; i++) line(...tail[i], ...tail[i + 1], (x, y) => { px(x, y, 18); px(x, y + 1, 17); });
  const [ex, ey] = tail[tail.length - 1]; px(ex - 1, ey + 1, 17);
}

function drawAir(f) {
  // 光柱：抖动提亮（不覆盖人物）
  const protect = new Set([23, 10, 9, 17, 18, 19]);
  fillPoly(BEAM, (x, y) => {
    const c = get(x, y);
    if (protect.has(c) && x > 148 && x < 186 && y > 104 && y < 160) return null;
    const t = 0.95 - (y - 30) / 320 - Math.abs(x - (227 - (y - 30) * 0.18)) / 150;
    return bay(x, y) < t ? (LIGHTER[c] ?? c) : null;
  });
  // 从太阳散开的几道光束
  for (const [ang, w, a] of [[2.05, 0.035, 0.6], [2.3, 0.05, 0.5], [2.6, 0.03, 0.5], [1.75, 0.03, 0.5], [2.85, 0.04, 0.4]]) {
    const L = 360, sx = 232, sy = 98;
    fillPoly([[sx, sy], [sx + Math.cos(ang - w) * L, sy + Math.sin(ang - w) * L], [sx + Math.cos(ang + w) * L, sy + Math.sin(ang + w) * L]], (x, y) => {
      const c = get(x, y); if (protect.has(c) && x > 148 && x < 186 && y > 104 && y < 160) return null;
      const t = a * (1 - Math.hypot(x - sx, y - sy) / L);
      return bay(x, y) < t ? (LIGHTER[c] ?? c) : null;
    });
  }
  // 散落在墙面和地板上的光斑
  const rs = rng(77);
  for (let i = 0; i < 26; i++) {
    const x = Math.floor(20 + rs() * 290), y = Math.floor(30 + rs() * 145), big = rs() < 0.4;
    if (x > 150 && x < 186 && y > 104 && y < 162) continue;
    const c = y < FLOOR_Y ? (big ? 25 : 8) : (big ? 9 : 16);
    px(x, y, c); if (big) { px(x + 1, y, c); px(x, y + 1, c); px(x + 1, y + 1, LIGHTER[c] ?? c); }
  }
  // 浮尘与被风卷入的纸屑：每帧一组固定位置（逐帧换画）
  const r = rng(101 + f * 977);
  for (let i = 0; i < 18; i++) {
    const y = 34 + r() * 120, cx = 227 - (y - 30) * 0.18, x = cx + (r() - 0.5) * (46 + (y - 30) * 0.5);
    if (inPoly(x, y, BEAM)) px(x, y, r() < 0.4 ? 11 : 10);
  }
  const scraps = [[[132, 150], [118, 141], [104, 160]], [[128, 147], [113, 144], [100, 157]], [[125, 151], [110, 140], [97, 160]], [[129, 153], [115, 142], [101, 162]]][f];
  for (const [x, y] of scraps) { px(x, y, 9); px(x + 1, y, 8); }
}

function vignette() {
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const d = Math.hypot((x - 200) / 190, (y - 100) / 120);
    if (bay(x, y) < (d - 0.75) * 1.6) px(x, y, DARKER[get(x, y)] ?? get(x, y));
  }
}

// ───── 输出：320×180 → ×6 整数放大，关闭平滑 ─────
const small = document.createElement('canvas'); small.width = W; small.height = H;
const sctx = small.getContext('2d');
const out = document.getElementById('out'), octx = out.getContext('2d');
function render(f) {
  drawStatic(); drawCurtain(f); drawGirl(f); drawAir(f); vignette();
  const img = sctx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) { const [r, g, b] = RGB[buf[i]]; img.data.set([r, g, b, 255], i * 4); }
  sctx.putImageData(img, 0, 0);
  octx.imageSmoothingEnabled = false;
  octx.drawImage(small, 0, 0, W * SCALE, H * SCALE);
  window.usedColors = new Set(buf).size;
}
let frame = 0;
render(frame);
window.anim = setInterval(() => { frame = (frame + 1) % 4; render(frame); }, 1000 / 6);   // 6 fps 逐帧换画

window.exportPNG = async (f = 0, name = '1_pixel.png') => {
  clearInterval(window.anim); render(f);
  const blob = await new Promise(r => out.toBlob(r, 'image/png'));
  const res = await fetch('/save?name=' + name, { method: 'POST', body: blob });
  return { status: await res.text(), colors: window.usedColors, size: [out.width, out.height] };
};
</script>
</body>
</html>
