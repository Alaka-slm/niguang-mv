<script>
// 每个镜头一张关键帧草图（1920×1080，蜡笔笔刷）。角色一律经由 Crab.draw() / Crab.drawProp() 绘制。
// 用法：exportAll() 逐镜头渲染并存为 storyboard/<镜头号>.png
const W = 1920, H = 1080;
let paperG, toothG, CUR = null, PHASE = 0;

// ───────── 笔刷工具 ─────────
const R = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
const E = (cx, cy, rx, ry, n = 36) => Array.from({ length: n }, (_, i) => [cx + Math.cos(i / n * TAU) * rx, cy + Math.sin(i / n * TAU) * ry]);
function hatch(pts, col, { dist = 6, angle = 45, cross = null, w = 1, kind = 'cpencil', rand = 0.12 } = {}) {
  brush.noStroke(); brush.noFill(); brush.setHatch(kind, col, w);
  brush.hatch(dist, angle, { rand, continuous: true, gradient: 0 }); brush.polygon(pts);
  if (cross !== null) { brush.hatch(dist * 1.3, cross, { rand, continuous: true, gradient: 0 }); brush.polygon(pts); }
  brush.noHatch();
}
function ln(pts, col, w = 1, kind = '2B') { brush.noHatch(); brush.set(kind, col, w); for (let i = 0; i < pts.length - 1; i++) brush.line(pts[i][0], pts[i][1], pts[i + 1][0], pts[i + 1][1]); brush.noStroke(); }
function lp(pts, col, w = 1, kind = '2B') { ln(pts.concat([pts[0]]), col, w, kind); }   // 注意：不能命名为 line/loop，会覆盖 p5 全局函数（p5.brush 会调用它们）
function ring(x, y, r, col, w = 1, kind = 'cpencil') { brush.noHatch(); brush.set(kind, col, w); brush.circle(x, y, r, true); brush.noStroke(); }
const P = (xp, yp) => [xp / 100 * W, yp / 100 * H];
// 小螃蟹：按分镜构图记法（朝向·高度%·(x,y)）放置
const FACE = { 正: 'front', 背: 'back', 侧右: 'right', 侧左: 'left' };
function crab(face, hp, xp, yp, o = {}) {
  const size = hp / 100 * H / 176 * (o.sit ? 1.15 : 1);
  Crab.draw(Object.assign({ x: xp / 100 * W, y: yp / 100 * H + 89 * size, size, facing: FACE[face] }, o));
  return size;
}
function lantern(xp, yp, size, lit = true) {
  const [x, y] = P(xp, yp);
  if (lit) { hatch(E(x, y, 46 * size, 46 * size), '#ffd98a', { dist: 5, angle: 60, w: 0.8 }); hatch(E(x, y, 30 * size, 30 * size), '#fff0c0', { dist: 4, angle: 120, w: 0.8 }); }
  Crab.drawProp(lit ? 'lantern' : 'lantern_off', x, y, size);
}
function motion(pts, col = '#9fb6e0') { ln(pts, col, 0.6, 'HB'); }

// ───────── 场景积木 ─────────
const NIGHT = { wall: '#26306a', wall2: '#1b2252', floor: '#4a3a55', seam: '#2b2133' };
const DAY = { wall: '#7a4a6e', wall2: '#d9784e', floor: '#8a5a52', seam: '#5a3a40' };
function room(p = NIGHT, floorY = 780) {
  hatch(R(0, 0, W, floorY), p.wall, { dist: 6, angle: 30, cross: 120, w: 1.1 });
  hatch(R(0, floorY, W, H - floorY), p.floor, { dist: 6, angle: -15, cross: 80, w: 1.1 });
  for (const y of [floorY + 50, floorY + 120, floorY + 210]) ln([[0, y], [W, y - 6]], p.seam, 0.8);
}
function warmGlow(x, y, rx, ry) {
  hatch(E(x, y, rx, ry), '#d9784e', { dist: 7, angle: 70, w: 1 });
  hatch(E(x, y, rx * 0.62, ry * 0.62), '#f4b456', { dist: 6, angle: 100, w: 1 });
}
function door(x, y, w, h, { open = 0, inside = '#1d2350', glow = false } = {}) {
  if (open > 0) { hatch(R(x, y, w, h), inside, { dist: 5, angle: 90, cross: 0, w: 1 }); if (glow) hatch(E(x + w / 2, y + h * 0.75, w * 0.6, h * 0.3), '#ffd98a', { dist: 4, angle: 70, w: 0.9 }); }
  else hatch(R(x, y, w, h), '#5a3f45', { dist: 5, angle: 85, w: 1 });
  lp(R(x, y, w, h), '#151833', 2, 'charcoal');
  if (open > 0) { const px = x + w; hatch([[px, y], [px + w * 0.35 * open, y - 30], [px + w * 0.35 * open, y + h + 30], [px, y + h]], '#5a3f45', { dist: 5, angle: 85 }); lp([[px, y], [px + w * 0.35 * open, y - 30], [px + w * 0.35 * open, y + h + 30], [px, y + h]], '#151833', 1.2, 'charcoal'); }
  else hatch(E(x + w * 0.85, y + h * 0.5, 10, 10, 12), '#c9a070', { dist: 2, angle: 30 });
}
function nightSky(x, y, w, h, stars = 14, seed = 1) {
  hatch(R(x, y, w, h), '#1f2758', { dist: 5, angle: 100, cross: 10, w: 1 });
  randomSeed(seed); for (let i = 0; i < stars; i++) { const sx = x + random(w), sy = y + random(h * 0.7); ln([[sx - 6, sy], [sx + 6, sy]], '#f6eecf', 0.7, 'cpencil'); ln([[sx, sy - 6], [sx, sy + 6]], '#f6eecf', 0.7, 'cpencil'); }
}
function sunriseSky(x, y, w, h) {
  const bands = [['#56609f', 0, 0.3], ['#c8707a', 0.25, 0.28], ['#ef9450', 0.48, 0.25], ['#ffd27a', 0.7, 0.3]];
  for (const [c, a, b] of bands) hatch(R(x, y + h * a, w, h * b), c, { dist: 5, angle: 95, cross: 15, w: 1 });
}
function sea(y, col = '#24305e', y2 = H) { hatch(R(0, y, W, y2 - y), col, { dist: 6, angle: 0, cross: 170, w: 1 }); for (let k = 0; k < 6; k++) ln([[0, y + 30 + k * 40], [W, y + 26 + k * 40]], '#5d6fb0', 0.5, 'HB'); }
function sand(y, col = '#4e4258') { hatch(R(0, y, W, H - y), col, { dist: 6, angle: -20, cross: 60, w: 1.1 }); }
function sun(x, y, r) { hatch(E(x, y, r * 2, r * 2), '#ffd98a', { dist: 6, angle: 70, w: 0.9 }); hatch(E(x, y, r, r), '#fff2c4', { dist: 3, angle: 30, cross: 120, w: 1.1 }); ring(x, y, r, '#f6a84a', 1.2); }
function windowFrame(x, y, w, h, sky = 'night', open = false) {
  if (sky === 'night') nightSky(x, y, w, h, 8, 3); else if (sky === 'dark') hatch(R(x, y, w, h), '#141a3c', { dist: 4, angle: 90, cross: 0, w: 1.1 }); else { sunriseSky(x, y, w, h); sun(x + w * 0.6, y + h * 0.78, 50); }
  lp(R(x, y, w, h), '#151833', 2.2, 'charcoal'); ln([[x + w / 2, y], [x + w / 2, y + h]], '#151833', 1.6, 'charcoal'); ln([[x, y + h * 0.45], [x + w, y + h * 0.45]], '#151833', 1.6, 'charcoal');
  ln([[x - 20, y + h + 14], [x + w + 20, y + h + 14]], '#151833', 2.2, 'charcoal');
  if (open) { const pane = [[x + w, y], [x + w + w * 0.28, y - 40], [x + w + w * 0.28, y + h + 40], [x + w, y + h]]; hatch(pane, sky === 'sunrise' ? '#e0955a' : '#3a4a80', { dist: 5, angle: 85 }); lp(pane, '#151833', 1.4, 'charcoal'); }
}
function table(x, y, w) { hatch(R(x, y, w, 26), '#6b4a3a', { dist: 4, angle: 10 }); ln([[x + 20, y + 26], [x + 20, y + 200]], '#3a2a2a', 1.6, 'charcoal'); ln([[x + w - 20, y + 26], [x + w - 20, y + 200]], '#3a2a2a', 1.6, 'charcoal'); }
function beam(pts, col = '#ffe1a0', dist = 18) { hatch(pts, col, { dist, angle: 105, w: 0.6, rand: 0.3 }); }
function lighthouse(x, y) { hatch([[x - 22, y], [x + 22, y], [x + 12, y - 150], [x - 12, y - 150]], '#d9d2c4', { dist: 3, angle: 0 }); hatch(R(x - 16, y - 175, 32, 25), '#ffd36e', { dist: 2.5, angle: 45 }); lp([[x - 22, y], [x + 22, y], [x + 12, y - 150], [x - 12, y - 150]], '#151833', 0.8); }
function moon(x, y, r) { hatch(E(x, y, r, r), '#f6eecf', { dist: 3, angle: 40, cross: 130 }); ring(x, y, r, '#c9c0a0', 0.8); }
function post(x, y, h) { hatch(R(x - 18, y - h, 36, h), '#6b4a3a', { dist: 4, angle: 80 }); lp(R(x - 18, y - h, 36, h), '#2a1a1a', 0.8); }

const ORDER = Object.keys(SHOTS);

function setup() {

function draw() {

async function renderShot(id) {

window.progress = [];
window.exportAll = async (ids = ORDER) => { for (const id of ids) { const t0 = performance.now(); try { await renderShot(id); window.progress.push([id, Math.round(performance.now() - t0)]); } catch (e) { window.progress.push([id, 'ERR ' + e.message]); } } window.progress.push(['DONE']); };
